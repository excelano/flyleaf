# The web build: `trunk build --release` writes dist/ from flyleaf/index.html,
# compiling the flyleaf binary for wasm32-unknown-unknown and running
# wasm-bindgen over it. `trunk serve` does the same and serves it.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)
[build]
target = "flyleaf/index.html"
dist = "dist"
# The size profile in Cargo.toml, not `release`: the page pays for every byte.
cargo_profile = "web"
# The page is served from excelano.com/flyleaf/try/, and the loader trunk
# writes into index.html reaches the wasm and the glue by this prefix. A
# build for the site root would load them from /flyleaf-….js and fail there.
public_url = "/flyleaf/try/"
