# Build the Linux packages, both architectures, and put them under the checks a
# machine can run: ownership and modes, md5sums, lintian, the desktop entry, and
# that the package installs and the executable it installs will load. On a push
# this is a check; on a published release it is also where the packages come
# from and what attaches them.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Fires when a person publishes the release, which on this loop is what
  # happens: nothing else creates it. A release created by a workflow using
  # the default GITHUB_TOKEN fires no event at all, so the dispatch below is
  # the fallback for that case.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build packages for (e.g. v0.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Keyed by the tag when this is releasing and by the ref when it is checking,
  # so the two never share a group. They did, and a push to main cancelled the
  # dispatched run that was building flyleaf 0.2.2's packages a minute after it
  # started — `github.ref` is refs/heads/main for a workflow_dispatch as much
  # as for a push.
  group: linux-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  # A superseded check is worth cancelling; a half-built release is not. The
  # next push is not a reason to stop producing an artefact somebody is waiting
  # to install.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  package:
    # Each architecture on a runner of that architecture rather than
    # cross-compiled, which is what lets the checks below mean something about
    # the package they actually produced.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: What is installed
        run: rustc -V && cargo -V && dpkg-deb --version | head -1

      - name: Build the package
        run: |
          cargo build --release
          ./packaging/debian/build-deb.sh

      # Cheap, and the one thing that goes wrong silently when a package is
      # built somewhere other than where it was compiled: a package labelled
      # arm64 carrying an x86-64 executable installs perfectly and then does
      # not run.
      - name: The package is the architecture it claims
        run: |
          deb=$(ls dist/*.deb)
          test "$(dpkg-deb -f "$deb" Architecture)" = "${{ matrix.arch }}"

      - uses: excelano/.github/.github/actions/linux-package-integrity-check@main

      - uses: excelano/.github/.github/actions/linux-lintian-check@main

      # The library check needs a display and runs by hand; `CLAUDE.md` says
      # when. What can run here is the half that needs none: the entry the
      # package installs is a valid desktop entry naming the type.
      - name: The desktop entry is valid
        run: |
          sudo apt-get install -y -qq desktop-file-utils
          desktop-file-validate packaging/linux/flyleaf.desktop

      # **This is weaker than segler's, and deliberately so.** Segler ships a
      # command-line binary that answers `--version` in a terminal, so its
      # workflow can install the package and run what it installed. Flyleaf
      # ships one executable, it is the application, and it opens a window
      # from `main` with no argument that would make it do anything else — so
      # there is nothing here to run to completion.
      #
      # What is still worth asking on a machine of this architecture is
      # whether the loader will take the executable at all: whether it is the
      # right machine type, and whether everything it links resolves once the
      # package's dependencies are installed. Both are the failures a
      # cross-built or under-declared arm64 package produces, and neither
      # needs a display. Running it and reading how it fails is what separates
      # them: a binary that gets as far as complaining about a display has
      # been loaded, and one that cannot be loaded says so in the words below.
      #
      # It does not reach a window. `packaging/linux/check-libraries.sh` is
      # what does that, on a machine with a display, and it is what catches a
      # library opened by name at run time — which `ldd` cannot see and this
      # cannot either.
      - uses: excelano/.github/.github/actions/linux-install-check@main
        with:
          binaries: flyleaf

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  # Only on a release. A push builds the packages to check them and then
  # throws them away, which is the point of building them on a push.
  attach:
    needs: package
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: excelano/.github/.github/actions/linux-attach-release-packages@main
        with:
          tag: ${{ github.event.release.tag_name || inputs.tag }}
