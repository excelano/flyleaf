# The suite, the clippy rule, the floor, and the rule against compiling C, on
# every push. Linux only, and that is enough for now: the widget has no
# platform arms, and slipcase-desktop's three workflows build it on Windows and
# Apple silicon through the dependency. When the application binary lands, the
# other two platforms get a file each here, as they have there.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: CI

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: What is installed
        run: rustc -V && cargo -V

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

      # `CLAUDE.md` says clippy must be silent, so a warning is an error here.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Formatted
        run: cargo fmt --check

      # `CLAUDE.md` forbids compiling C, and `cargo tree -i cc` is not the
      # check, for the reason slipcase-desktop's workflow records: `cc` sits in
      # egui's tree as an ordinary Rust crate and always will. The outcome is
      # what the rule means, so the outcome is what is checked: no object file
      # under the build directory, and the binary linking libc, libgcc and libm
      # and nothing else, everything a window needs being opened at run time.
      - name: Nothing compiled C
        run: |
          target=$(cargo metadata --format-version 1 --no-deps |
              sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')
          objects=$(find "${target}" -path '*/build/*' \( -name '*.o' -o -name '*.a' \) -print)
          [ -z "$objects" ] || { echo "a build script produced object files:"; echo "$objects"; exit 1; }

          echo "linked at load time:"
          ldd "${target}/debug/flyleaf" | sed 's/^/  /'
          strange=$(ldd "${target}/debug/flyleaf" |
              awk '{print $1}' | grep -vE '^(linux-vdso|libgcc_s|libm|libc|/lib64/ld-linux)' || true)
          [ -z "$strange" ] || { echo "unexpected shared libraries:"; echo "$strange"; exit 1; }

      # The widget on its own, which is what slipcase-desktop takes: no window
      # framework comes with it unless asked for.
      - name: The widget builds without the application
        run: cargo check -p flyleaf --no-default-features

      # The Debian package, on every push rather than once before a release,
      # with the mechanical half of its checks: everything root/root and
      # nothing carrying a mode a package should not ship, md5sums present
      # and agreeing with the files, and lintian gating on errors and
      # warnings. Info and pedantic are Debian's suggestions rather than its
      # rules, and a build should not fail on a suggestion nobody has read.
      - name: Build the package
        run: |
          cargo build --release
          ./packaging/debian/build-deb.sh

      - name: The package holds up
        run: |
          deb=$(ls dist/*.deb)
          echo "checking ${deb}"
          strange=$(dpkg-deb --contents "$deb" | awk '$2 != "root/root"')
          [ -z "$strange" ] || { echo "not root/root:"; echo "$strange"; exit 1; }
          strange=$(dpkg-deb --contents "$deb" |
              awk '$1 !~ /^drwxr-xr-x/ && $1 !~ /^-rw-r--r--/ && $1 !~ /^-rwxr-xr-x/')
          [ -z "$strange" ] || { echo "unexpected modes:"; echo "$strange"; exit 1; }
          dpkg-deb --ctrl-tarfile "$deb" | tar t | grep -qx './md5sums' ||
              { echo "the package ships no md5sums" >&2; exit 1; }
          tree="${RUNNER_TEMP}/tree"
          dpkg-deb -x "$deb" "$tree"
          dpkg-deb -e "$deb" "${tree}/DEBIAN"
          ( cd "$tree" && md5sum -c DEBIAN/md5sums --quiet )

      - name: What lintian says
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          lintian --info --tag-display-limit 0 --fail-on error,warning dist/*.deb

      # The library check needs a display and runs by hand; `CLAUDE.md` says
      # when. What can run here is the half that needs none: the entry the
      # package installs is a valid desktop entry naming the type.
      - name: The desktop entry is valid
        run: |
          sudo apt-get install -y -qq desktop-file-utils
          desktop-file-validate packaging/linux/flyleaf.desktop

  # The web build. Checked and linted rather than bundled: the page is built
  # with trunk by hand, and the hosted demo that will build it here is Phase
  # 3's. What this catches is a desktop assumption reaching the shell, which
  # the native jobs cannot see: a thread, a path, a file.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Check
        run: cargo check -p flyleaf --target wasm32-unknown-unknown
      - name: Clippy
        run: cargo clippy -p flyleaf --target wasm32-unknown-unknown -- -D warnings

  # `rust-version` in Cargo.toml is a claim, and this is what makes it a
  # measurement. The number is read out of the manifest rather than written
  # here twice.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build at the floor
        run: |
          floor=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "floor: ${floor}"
          rustup toolchain install "$floor" --profile minimal
          cargo "+${floor}" build --all-targets
