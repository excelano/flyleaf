# Run the suite on Apple silicon and open a document through Launch Services, so
# `src/opened_document.rs` receives the Apple Event a double-click delivers.
# It does not say the document was delivered rather than the application merely
# launched: the window title would say so, and reading titles needs Screen
# Recording permission a runner does not grant. Out of reach here: a sandbox,
# which needs a signing identity; a high-density display; the Finder icon.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: Apple silicon

on:
  push:
  pull_request:
  # The release event is what builds the binary the Mac signs. A person's
  # token creates the release, so the event fires.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      # Optional, because a screenshots run has no tag to give. With one the
      # binary the Mac signs is built and attached to that release; without one
      # this is the suite, the window and whatever screenshots were asked for.
      tag:
        description: 'Tag to build the release binary for'
        required: false
        type: string
      # A choice rather than a boolean, because there is a third thing to ask
      # for: `reference` takes the one plain frame a coordinate gets measured
      # off, and `full` takes the set.
      screenshots:
        description: 'Store screenshots'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'reference', 'full']

permissions:
  contents: write

jobs:
  arm64:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      # A label is a promise rather than a fact: `macos-13` is Intel and
      # `macos-14` onwards is Apple silicon, which is a mapping GitHub can
      # change. Checked, so that this fails loudly rather than quietly testing
      # x86_64 twice.
      - name: The runner is Apple silicon
        run: |
          arch=$(uname -m)
          echo "runner reports ${arch}"
          [ "$arch" = arm64 ] || {
            echo "this workflow exists to test arm64 and the runner is ${arch}" >&2
            exit 1
          }

      - name: What is installed
        run: rustc -V && cargo -V

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The bundle is the unit: a bare executable has no bundle identifier and
      # no Apple Event reaches it. From the debug binary the steps above
      # produced, since the question does not depend on optimisation.
      - name: Assemble the bundle
        run: |
          target=$(cargo metadata --format-version 1 --no-deps |
              sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')
          ./packaging/macos/build-app.sh --binary "${target}/debug/flyleaf"
          lipo -info "dist/Tommy Flyleaf.app/Contents/MacOS/flyleaf"

      - name: A document opens, and a window appears
        run: |
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$lsregister" -f "$PWD/dist/Tommy Flyleaf.app"

          swiftc -O packaging/macos/window-probe.swift -o "${RUNNER_TEMP}/window-probe"

          open -a "$PWD/dist/Tommy Flyleaf.app" packaging/sample.toml

          # Cold launch, a window server, and a first frame. Polled rather than
          # slept at; 30 seconds is far past anything measured by hand.
          for _ in $(seq 1 15); do
            sleep 2
            "${RUNNER_TEMP}/window-probe" "Tommy Flyleaf" >/dev/null 2>&1 && break
          done

          set +e
          "${RUNNER_TEMP}/window-probe" "Tommy Flyleaf"
          verdict=$?
          set -e
          case "$verdict" in
            0)
              echo "the arm64 build drew a window for a document opened through Launch Services"
              ;;
            2)
              echo "::error::The window server listed nothing, so this run answered nothing about the window. Decide whether this runner can host one at all before trusting a green tick here."
              exit 1
              ;;
            *)
              echo "::error::No window appeared for a document opened through Launch Services on arm64. This is src/opened_document.rs, the only unsafe in this crate."
              exit 1
              ;;
          esac

      # For eyes, not for the verdict.
      - name: Photograph it, for a person
        if: always()
        run: |
          screencapture -x "${RUNNER_TEMP}/screen.png" || true
          ls -l "${RUNNER_TEMP}/screen.png" || true

      - name: Keep the photograph
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-window
          path: ${{ runner.temp }}/screen.png
          if-no-files-found: warn

      # Built here and signed on the Mac: the Distribution certificate stays
      # where it is, and the slow half plus the two checks that cost a review
      # cycle happen before anybody is waiting. The steps are excelano/.github's,
      # because every repository with this target needs the same ones.
      - name: The binary the Store package is built from
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: excelano/.github/.github/actions/mac-release-binary@main
        with:
          binary: flyleaf
          package: flyleaf
          tag: ${{ github.event.release.tag_name || inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Off unless asked for. A bug fix should not pay for a set of Store
      # screenshots, and a set nobody asked for is a set nobody looks at.
      # `shots.sh` carries the recipes and is the same command that retakes
      # them by hand on a Mac; everything around it is the org's.
      - name: The Store screenshots
        if: inputs.screenshots && inputs.screenshots != 'no'
        uses: excelano/.github/.github/actions/mac-store-screenshots@main
        with:
          app: 'dist/Tommy Flyleaf.app'
          mode: ${{ inputs.screenshots }}
          languages: en de
