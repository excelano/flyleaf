# Run the suite on Windows, check the things only a Windows machine can say,
# and assemble the Store package, attaching it to a published release. The
# checks themselves live in excelano/.github so every desktop-app repo in the
# fleet runs the same ones and a correction reaches all of them at once; what
# stays here is this product's own names, paths and screenshot recipe.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Fires when a person publishes the release, which on this loop is what
  # happens: nothing else creates it. A release created by a workflow using the
  # default GITHUB_TOKEN fires no event at all, so the dispatch is the fallback.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      # Optional, because a screenshots run has no tag to give. With one the
      # package is attached to that release; without one it is built and kept
      # as an artefact.
      tag:
        description: 'Tag to package for (e.g. v0.2.3)'
        required: false
        type: string
      # A choice rather than a boolean, because there is a third thing to ask
      # for: `reference` takes the one plain frame a coordinate gets measured
      # off, and `full` takes the set.
      screenshots:
        description: 'Store screenshots'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'reference', 'full']

permissions:
  contents: write

jobs:
  windows:
    uses: excelano/.github/.github/workflows/windows-desktop-ci.yml@main
    with:
      tag: ${{ inputs.tag }}
      binary-names: flyleaf
      icon-check: true
      icon-check-paths: 'packaging/windows/flyleaf.ico packaging/windows/assets packaging/windows/listing'
      # No contentType: this installer writes `Content Type` on the extension
      # and no MIME database entry, and asserting one it never claimed is the
      # check being wrong rather than the installer.
      install-check-associations: '[{"extension": ".toml", "progId": "Excelano.Flyleaf"}]'
      install-check-owns-extension: 'true'
      install-check-args: '-Default -NoBinary'
      screenshots: ${{ inputs.screenshots }}
      shot-out: dist/store
      # The file is opened through the shell, so the association has to exist
      # and has to be this application's: `-Default` writes the extension's
      # default value, which the install check deliberately does not.
      pre-screenshot-script: powershell -ExecutionPolicy Bypass -File packaging/windows/install.ps1 -Default
    secrets: inherit
