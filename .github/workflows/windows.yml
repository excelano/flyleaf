# Run the suite on Windows, check the things only a Windows machine can say —
# what the binary imports, that the install scripts go on and come off cleanly,
# that the committed icons match their generator — and assemble the Store
# package, attaching it to a published release. Out of reach here: the window,
# the certification kit, and the icon as a person sees it at any size.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: Windows

on:
  push:
  pull_request:
  # Fires when a person publishes the release, which on this loop is what
  # happens: nothing else creates it. A release created by a workflow using the
  # default GITHUB_TOKEN fires no event at all, so the dispatch is the fallback.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to package for (e.g. v0.2.3)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Keyed by the tag when this is releasing and by the ref when it is checking,
  # so the two never share a group. `github.ref` is refs/heads/main for a
  # workflow_dispatch as much as for a push, which is how a push to main
  # cancelled the dispatched run building flyleaf 0.2.2's Linux packages.
  group: windows-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  # A superseded check is worth cancelling; a half-built release is not.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: What is installed
        run: |
          rustc -V
          cargo -V

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # slipcase-desktop 0.1.1 was packaged, certified, submitted and failed
      # Store policy 10.2.4.1 for importing VCRUNTIME140.dll from the Visual
      # C++ Redistributable, which every build machine has and a tester's
      # clean one does not. `.cargo/config.toml` is the fix and this is the
      # guard on it, against the release binary because that is what ships.
      - name: Every DLL the shipped binary imports comes with Windows
        run: |
          cargo build --release
          powershell -ExecutionPolicy Bypass -File packaging/windows/check-imports.ps1

      # The install scripts against the registry, read back. The steps are
      # excelano/.github's: it was the same script in three repositories and
      # absent from three more, and the absent ones included the repository
      # whose uninstall reported success while leaving the association dead.
      - name: The integration goes on and comes off cleanly
        uses: excelano/.github/.github/actions/windows-install-check@main
        with:
          associations: '[{"extension": ".toml", "progId": "Excelano.Flyleaf", "contentType": "application/toml"}]'
          owns-extension: 'true'
          install-args: '-Default -NoBinary'

      # The `.ico` and the Store assets are committed artifacts, because
      # nothing on Windows rasterizes an SVG and `rc.exe` is a tool the build
      # keeps out. A committed artifact can fall out of step with the drawing
      # it was generated from and nothing would say so, so the generator is
      # run and its output compared against the tree.
      - name: The committed icon and Store assets still match their generator
        run: |
          cd packaging/windows/make-ico
          cargo run --release
          cd ../../..
          git diff --exit-code -- packaging/windows/flyleaf.ico packaging/windows/assets packaging/windows/listing

      # The Store takes the package unsigned, and the runner assembles the one that
      # is uploaded. The steps are excelano/.github's, because they were the same in
      # every repository that has this target; the publisher is the organisation
      # secret, being the one value in the identity that is an account's rather than
      # this product's.
      - name: The Store package
        uses: excelano/.github/.github/actions/store-package@main
        with:
          publisher: ${{ secrets.STORE_PUBLISHER }}
          tag: ${{ github.event.release.tag_name || inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
