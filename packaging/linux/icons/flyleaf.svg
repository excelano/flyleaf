<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Tommy Flyleaf: a bound book, face on, with its cover folded back to the
    flyleaf, the blank page inside the cover that is the one place in a book
    meant for someone to write on later. The page has its corner turned and
    three lines of a tree on it, a key and two beneath it. The cloth is the
    oxblood and the spine the brass that excelano.com/flyleaf is set in, so
    that the icon, the page and the store listings read as one thing.

    Author: David M. Anderson
    Built with AI assistance (Claude, Anthropic)

    This comment is inside the element rather than above it, for the reason
    slipcase-desktop's icon records: gdk-pixbuf sniffs for `<svg` within the
    first 256 bytes and refuses the file otherwise, and a file manager then
    shows the generic icon. Keep the opening tag on the second line.

    Drawn on a 64-unit grid with 3-unit strokes, so it survives the 16-pixel
    size a file manager uses in a list; checked there, at 24, 32, 48 and 128,
    on a light ground and a dark one, before this replaced the placeholder.
    The cover is drawn first, the spine over its left edge, and the page over
    both, which is what puts the page inside the book. Anything finer than a
    page, a fold and three lines is mud at 16 pixels.
  -->
  <g stroke="#2f3337" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- The cover, oxblood cloth. -->
    <rect x="6" y="4" width="52" height="56" rx="3" fill="#5c2231"/>
    <!-- The spine, brass, rounded only where it shares the cover's corners. -->
    <path d="M9 4 H15 V60 H9 a3 3 0 0 1 -3 -3 V7 a3 3 0 0 1 3 -3 Z" fill="#c9963a"/>
    <!-- The flyleaf, set in from the spine, its top-right corner turned back. -->
    <path d="M20 10 H45 L53 18 V54 H20 Z" fill="#f2ece1"/>
    <path d="M45 10 V18 H53" fill="#d9cfbf"/>
    <!-- Three lines of the tree: a key, and two beneath it, indented. -->
    <path d="M27 27 H40" stroke="#5c2231"/>
    <path d="M31 36 H46" stroke="#5c2231"/>
    <path d="M31 45 H41" stroke="#5c2231"/>
  </g>
</svg>
