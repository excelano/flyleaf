# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.


version = "0.2.8"

[locales."de-de"]
whats-new = """
Am Editor ändert sich nichts. Anwendungen, die den Baum einbetten, um ein \
Dokument nur zu zeigen, bekommen die schreibgeschützte Regel jetzt vom \
Baum selbst, statt sie jede für sich zu schreiben. Unter Linux folgt das \
Fenster der Hell-Dunkel-Einstellung des Desktops wie bisher; der Teil, der \
das tut, ist nun ein eigenes Paket, das auch die anderen Anwendungen von \
Excelano verwenden.
"""

[locales."en-us"]
whats-new = """
Nothing in the editor changes. Applications which embed the tree to show a \
document rather than edit one now get the read-only rule from the tree \
itself instead of each writing its own. On Linux the window follows the \
desktop's light and dark setting as before; the part that does so is now a \
crate of its own, shared with Excelano's other applications.
"""
