# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.


version = "0.2.7"

[locales."de-de"]
whats-new = """
Am Editor ändert sich nichts. Ein Baum, der als schreibgeschütztes Dokument \
gezeigt wird, blendet jetzt auch den Papierkorb neben jedem Element einer \
Liste aus — das letzte Bedienelement dieser Zeilen, das das Dokument \
verändert hätte. Anwendungen, die den Baum einbetten, um Beschreibungen zu \
zeigen statt sie zu bearbeiten, bekommen damit eine Ansicht, in der nichts \
mehr schreibt.
"""

[locales."en-us"]
whats-new = """
Nothing in the editor changes. A tree shown as a read-only document now also \
drops the bin beside each item of a list, which was the last control on those \
rows that would have changed the document. Applications which embed the tree \
to show a description rather than edit one get a pane with nothing on it that \
writes.
"""
