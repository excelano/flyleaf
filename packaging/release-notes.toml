# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.


version = "0.2.6"

[locales."de-de"]
whats-new = """
Am Editor ändert sich nichts. Darunter kann der Baum jetzt als Dokument \
gezeigt werden, das keine neuen Schlüssel aufnimmt: kein „neuer Schlüssel“, \
kein „Hinzufügen“, kein Kommentar am Ende. Das ist für Anwendungen gedacht, \
die den Baum einbetten, um Beschreibungen zu zeigen statt sie zu bearbeiten — \
ohne Bedienelemente anzubieten, die nichts speichern würde.
"""

[locales."en-us"]
whats-new = """
Nothing in the editor changes. Underneath it, the tree can now be shown as a \
document that takes no new keys: no add-a-key row, no Add button, no comment \
after the last item. That is for applications which embed the tree to show a \
description rather than edit one, so they no longer offer controls that \
nothing would save.
"""
