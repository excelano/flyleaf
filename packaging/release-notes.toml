# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.


version = "0.2.5"

[locales."de-de"]
whats-new = """
Tommy Flyleaf erscheint auf Deutsch, wenn der Rechner auf Deutsch eingestellt \
ist; es gibt nichts auszuwählen, denn die Anwendung liest die Sprache, die der \
Schreibtisch ohnehin kennt. Eine Übersetzung, deren englisches Original sich \
seitdem geändert hat, wird nicht angezeigt, sodass eine Meldung entweder \
aktuell oder deutlich englisch ist. Auf dem Mac gibt die Anwendung jetzt an, \
dass sie auf Deutsch angeboten wird, sodass die Sprachauswahl für einzelne \
Programme sie anbietet.

Auf dem Mac öffnet ein Doppelklick auf eine TOML-Datei sie in Tommy Flyleaf, \
und ein Speichern schreibt in die geöffnete Datei zurück.
"""

[locales."en-us"]
whats-new = """
Tommy Flyleaf draws in German where the desktop asks for German, with nothing \
to choose: it reads the language the desktop already knows. A translation \
whose English has since changed is not shown, so a message is either current \
or plainly in English. On a Mac the application now declares that it is \
offered in German, so the per-app language picker offers it.

On a Mac, double-clicking a TOML file opens it in Tommy Flyleaf, and saving \
writes back to the file you opened.
"""
