[package]
name = "flyleaf-core"
description = "The document model behind Tommy Flyleaf: TOML edited as a tree, with comments, order and formatting kept"
readme = "../README.md"
keywords = ["toml", "editor", "toml_edit"]
categories = ["parser-implementations", "config"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Reading and writing files. On by default; off for a target with no file
# system, which is what the web build will be.
[features]
default = ["fs"]
fs = ["dep:tempfile", "dep:objc2", "dep:objc2-foundation"]

[dependencies]
toml_edit.workspace = true
# A save is written beside the file and renamed over it, so a crash mid-write
# leaves the original whole. Pure Rust: its tree is declarations, not a C
# library to compile.
tempfile = { version = "3.27", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The two calls that let a sandboxed application replace a file it was given
# rather than write into a directory it was not: the request for somewhere to
# stage the rewrite on the file's own volume, and the replacement itself.
# Every call `save_to` makes into this is a safe function, so the crate keeps
# `forbid(unsafe_code)`; the unsafe is carried on our behalf, as `tempfile`'s
# is. slipcase-desktop's `staging.rs` is where both calls were measured.
# `NSArray` and `NSEnumerator` are not types this crate names: they are what
# `NSError::underlyingErrors` returns and what iterating it needs, and
# `objc2-foundation` gates a method on the features of every type in its
# signature. Without them the crate does not compile on a Mac at all — measured
# 2026-09-10, when `cargo package -p flyleaf-core` failed here while the
# workspace built, because `flyleaf`'s own feature list unifies both in and hid
# it. `cargo check -p flyleaf-core` is the check that sees it.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSFileManager", "NSPathUtilities", "NSError", "NSArray", "NSEnumerator"], optional = true }
# `Retained`, which the calls above return and the crate above does not
# re-export.
objc2 = { version = "0.6", default-features = false, features = ["std"], optional = true }
