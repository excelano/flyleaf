[package]
name = "flyleaf"
description = "Tommy Flyleaf: a structure-aware TOML editor, as an egui widget and as a desktop application"
readme = "../README.md"
keywords = ["toml", "editor", "egui", "gui"]
categories = ["gui", "config"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The application binary and what only it needs. On by default, so that
# `cargo install flyleaf` is the application; a consumer of the widget alone
# turns it off with `default-features = false` and carries no window framework
# it did not ask for.
[features]
default = ["app"]
app = ["dep:eframe", "dep:rfd", "dep:wasm-bindgen-futures", "dep:web-sys"]

[[bin]]
name = "flyleaf"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
# The widget wants egui and not eframe: it draws into a `Ui` somebody else
# owns a window for. slipcase-desktop reaches egui through eframe 0.36, which
# re-exports this same crate at this same version, so the types unify.
egui = "0.36"
# The window, for the binary alone. Defaults carry accesskit, which stays on.
eframe = { version = "0.36", optional = true }
# File dialogs, for the binary alone. Defaults are `xdg-portal` and `wayland`,
# both pure Rust; the `gtk3` feature links C through gtk-sys and stays off,
# which is what taking the defaults does.
rfd = { version = "0.17", optional = true }

# Core with its file half on a target that has a file system, and without it
# on the web, where a file arrives as bytes from a picker and leaves as a
# download. Two tables rather than one, because the `fs` feature pulls
# `tempfile`, which has no wasm build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flyleaf-core = { workspace = true, features = ["fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
flyleaf-core = { workspace = true }
# The browser: a future to run the dialog on, since there is no thread to
# run it on, and the page's canvas for eframe to draw into. Both for the
# binary alone; eframe and rfd carry their own.
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement"], optional = true }
