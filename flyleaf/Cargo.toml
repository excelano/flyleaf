[package]
name = "flyleaf"
description = "Tommy Flyleaf: a structure-aware TOML editor, as an egui widget and as a desktop application"
readme = "../README.md"
keywords = ["toml", "editor", "egui", "gui"]
categories = ["gui", "config"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The application binary and what only it needs. On by default, so that
# `cargo install flyleaf` is the application; a consumer of the widget alone
# turns it off with `default-features = false` and carries no window framework
# it did not ask for.
[features]
default = ["app"]
app = [
    "dep:eframe",
    "dep:rfd",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:ico",
    "dep:block2",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
]

[[bin]]
name = "flyleaf"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
# The language this widget's own strings are drawn in, and the reader for the
# `.po` catalogues in `po/`. Not optional and not behind `app`: the widget is
# the half slipcase-desktop draws, and a German window with an English tree in
# the middle of it was the whole reason this crate got a catalogue.
#
# It is the crate slipcase-desktop's `potext` module became on 2026-09-09 — the
# module could not be shared, because a published crate cannot reach into an
# application's `src/`. Pure Rust, no build script, and its two dependencies
# are platform-gated and already in this tree on their platforms.
potext = "0.1"
# The widget wants egui and not eframe: it draws into a `Ui` somebody else
# owns a window for. slipcase-desktop reaches egui through eframe 0.36, which
# re-exports this same crate at this same version, so the types unify.
egui = "0.36"
# The window, for the binary alone. Its defaults carry wgpu as the renderer
# and accesskit, both of which stay on for the native binary, in the two
# target tables below: the web build takes a different renderer, and one
# line here cannot say so.
# File dialogs, for the binary alone. Defaults are `xdg-portal` and `wayland`,
# both pure Rust; the `gtk3` feature links C through gtk-sys and stays off,
# which is what taking the defaults does.
rfd = { version = "0.17", optional = true }

# Core with its file half on a target that has a file system, and without it
# on the web, where a file arrives as bytes from a picker and leaves as a
# download. Two tables rather than one, because the `fs` feature pulls
# `tempfile`, which has no wasm build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flyleaf-core = { workspace = true, features = ["fs"] }
eframe = { version = "0.36", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
flyleaf-core = { workspace = true }
# eframe without its default `wgpu`, which on the web means WebGPU with a
# WebGL fallback and carries wgpu-core and naga into the page, and with
# `glow` instead, which is WebGL2 alone. Measured: the size profile took the
# wasm from 7.5 MB to 6.4 MB and this took it to 4.8 MB, 1.9 MB gzipped.
# Dropping `accesskit` here saved nothing, since the glow path enables it on
# egui anyway, so it stays for symmetry with the native line. The native
# binary above keeps wgpu, as slipcase-desktop does.
eframe = { version = "0.36", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "web_screen_reader"] }
# The browser: a future to run the dialog on, since there is no thread to
# run it on, and the page's canvas for eframe to draw into. Both for the
# binary alone; eframe and rfd carry their own.
wasm-bindgen-futures = { version = "0.4", optional = true }
# `Navigator` for `navigator.language`, which is the browser's answer to the
# question `potext` asks the operating system everywhere else: a page has no
# environment, no `NSLocale` and no registry. Read in `main`, and handed to
# `set_language` as a tag, so nothing about the web build reaches the widget.
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "Navigator"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Reading the window's icon out of the `.ico` the installer also registers.
# Windows takes a window icon from a resource compiled into the executable,
# and a resource compiler is what `CLAUDE.md` keeps out of the build, so the
# icon is embedded as bytes and decoded at startup. Pure Rust. For the binary
# alone.
ico = { version = "0.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# What `src/opened_document.rs` needs to receive a double-clicked document,
# which macOS delivers as an Apple Event and never as an argument. All four
# are already in the tree on this target under `winit` and `rfd`, so nothing
# compiles that did not compile before; features are named rather than taken,
# the narrow set slipcase-desktop measured, because `objc2-foundation`'s full
# set is what rustc segfaulted compiling there. For the binary alone.
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", default-features = false, features = ["std"], optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSAppleEventManager", "NSAppleEventDescriptor", "NSNotification", "NSOperation", "block2", "objc2-core-services"], optional = true }
