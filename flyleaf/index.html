<!doctype html>
<!--
  Tommy Flyleaf in a browser: one canvas that the application draws into,
  filling the page. trunk builds the wasm and writes the loader in here.

  Author: David M. Anderson
  Built with AI assistance (Claude, Anthropic)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tommy Flyleaf</title>
    <link data-trunk rel="rust" data-bin="flyleaf" data-wasm-opt="z" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #202020; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="flyleaf"></canvas>
  </body>
</html>
