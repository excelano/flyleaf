[workspace]
resolver = "3"
members = ["flyleaf-core", "flyleaf"]

[workspace.package]
version = "0.2.2"
edition = "2021"
authors = ["David M. Anderson"]
license = "MIT"
repository = "https://github.com/excelano/flyleaf"
# eframe's number rather than this code's, the same reasoning slipcase-desktop's
# manifest records: nothing here needs past edition 2021's 1.56, and every
# other crate in the tree sits below egui. It rises when egui raises its own,
# so the msrv job in ci.yml builds at it rather than trusting this line. Raise
# it here and there together.
rust-version = "1.95"

# The widget's dependency on the core lives here so that it sits beside the
# version above and the two obviously move together. crates.io rejects a
# path-only dependency and a version requirement cannot inherit
# `workspace.package.version`, so the number is written twice by necessity.
[workspace.dependencies]
# Without its `fs` feature here, so that the web build can leave the file
# system out; the native build turns it back on in the widget's manifest.
flyleaf-core = { path = "flyleaf-core", version = "0.2.2", default-features = false }

# One `toml_edit` across the fleet. `slpc` depends on this same major and
# re-exports it, and slipcase-desktop holds a `DocumentMut` from `slpc` and
# hands it to this widget: a second `toml_edit` in the graph would make that
# two types and stop slipcase-desktop compiling. Move this and `slpc` together.
toml_edit = "0.25"

# The web build's profile. Size is what a page pays for, so this trades the
# native binary's speed settings for the smallest wasm: `opt-level = "z"`
# and fat LTO with one codegen unit, so that egui's unused arms are dropped
# across crates, and `panic = "abort"`, since wasm has no unwinding to keep
# the landing pads for. Trunk.toml names this profile; the native binary
# keeps `release`. Measured in DESIGN.md §8 against the 7.5 MB
# the default release profile produced after wasm-opt.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

# winit 0.30 declares a private CoreGraphics symbol whether or not it is
# called, App Store review reads the symbol table rather than the call graph,
# and slipcase-desktop lost a review cycle to it (Guideline 2.5.1). Upstream
# removed it in winit#4541 behind a `private-apple-apis` feature that no
# published release carries yet, so this is that change on the `v0.30.13`
# tag, pinned by revision; `packaging/macos/build-app.sh` refuses any binary
# importing a symbol no public framework header declares, which is what found
# it. The same pin as slipcase-desktop's, moved together. **Delete it when a
# winit release carries the gate.** Patching from a git repository makes that
# repository's `dpi` a candidate too, so `Cargo.lock` moves by more than the
# winit line; slipcase-desktop's manifest records the one-line check.
[patch.crates-io]
winit = { git = "https://github.com/excelano/winit", rev = "3cfd905679da3ca241b97dea723211b580620a27" }
